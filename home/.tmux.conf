set-option -g default-terminal "tmux-256color"
set-option -as terminal-overrides ",*:Tc"
# let kitty graphics (inline images in omp etc.) pass through tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# smoother wheel scrolling in copy mode (default jumps 5 lines per notch)
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X scroll-down
bind -T copy-mode    WheelUpPane   select-pane \; send -X scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send -X scroll-down

set -sg escape-time 0
set -g focus-events on

setw -g mode-keys vi
set -g status-keys vi

# set -g display-time 4000
set -g message-style "bg=colour238,fg=colour255,bold"

# index
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 1000000
set -g mouse on
set -g set-clipboard on

# bindings
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

bind C-p previous-window
bind C-n next-window

bind '|' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind C split-window -h -c "#{pane_current_path}" "claude"
unbind '"'
unbind %

bind r source-file ~/.tmux.conf \; display ' Config reloaded !'

# panes
# set -g mouse-select-pane on
# set -g mouse-resize-pane on

# resize the pane
bind-key -r J resize-pane -D 3
bind-key -r K resize-pane -U 3
bind-key -r H resize-pane -L 3
bind-key -r L resize-pane -R 3

# moving between panes with vim movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# layouts
bind x kill-pane

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# tmux resurrect
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @open-B 'https://www.bing.com/search?q='
set -g @open-S 'https://www.google.com/search?q='

# General statusline customisation
set -g status-position top
set -g status-style fg=default,bg=default

# status-left style
set -g status-left-length 100
set -g status-left "#[fg=#585b70 bg=default]"
set -ga status-left "#{?client_prefix,#[bg=#f38ba8 fg=#1e1e2e bold] [P]> #S ,#[fg=#89b4fa bold] > #S }"
set -ga status-left "#[fg=#585b70 bg=default]"
set -ga status-left "#{?window_zoomed_flag,#[fg=#f9e2af bg=default](Zoom),}"
set -ga status-left "#{?#{==:#{pane_mode},copy-mode},#[fg=#f9e2af bg=default bold] (copy-mode),}"
set -ga status-left "#[fg=#585b70 bg=default] < @ "
set -ga status-left "#[fg=#f38ba8 bold]thinkpad:#[fg=#a6e3a1]#{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}}"
set -ga status-left "#[fg=#585b70 bg=default] > "

# status-right style
set -g status-right-length 100
set -g status-right "#[fg=#585b70]"
set -ga status-right " C:#{cpu_percentage} M:#{ram_percentage} "
set -ga status-right "#[fg=#585b70]-"
set -ga status-right "#[fg=#89b4fa] %H:%M on %d-%m/%y "

# window style
set -wg automatic-rename on
set -g automatic-rename-format ''
set -g window-status-separator ' - '
set -g status-justify 'absolute-centre'

# window status (basic colors)
set -g window-status-current-format "#[fg=#cdd6f4 bold]#I: #{pane_current_command}:#{?window_zoomed_flag,#[fg=#cdd6f4 bold]Z,}#{?#{==:#{pane_mode},copy-mode},#[fg=#cdd6f4 bold](C),}"
set -g window-status-format "#[fg=#585b70]#I: #[fg=#585b70]#{pane_current_command}:#{?window_zoomed_flag,#[fg=#a6e3a1]Z,}#{?#{==:#{pane_mode},copy-mode},#[fg=#a6e3a1](C),}"
set -g window-active-style 'fg=#cdd6f4,bg=#1e1e2e'
set -g window-style 'fg=#45475a,bg=#11111b'

run ~/.tmux/plugins/tpm/tpm
