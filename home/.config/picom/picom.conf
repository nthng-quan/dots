backend = "glx";
vsync = true;
unredir-if-possible = false;

shadow = false;
fading = true;
fade-in-step = 0.15;
fade-out-step = 0.15;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.90; };
  menu = { fade = true; shadow = false; };
  dropdown_menu = { fade = true; shadow = false; };
  popup_menu = { fade = true; shadow = false; };
};
