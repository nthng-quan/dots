# Mirrors alacritty.toml: Iosevka Nerd Font Mono, Catppuccin Mocha.

font_family      Iosevka Nerd Font Mono

font_size        14.0

# latency: render input immediately
input_delay 0
repaint_delay 6
sync_to_monitor no

scrollback_lines 10000
copy_on_select clipboard

# remote control for `kitten @` (local socket only)
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

window_padding_width 0
confirm_os_window_close 0
enable_audio_bell no
hide_window_decorations yes

# keep the block cursor at the shell prompt (shell integration defaults to a beam there)
shell_integration no-cursor
cursor_shape_unfocused hollow
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 3
mouse_hide_wait -1

# Catppuccin Mocha (same palette as alacritty/tmux/nvim)
foreground           #cdd6f4
background           #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0dc
cursor               #f5e0dc
cursor_text_color    #1e1e2e
url_color            #f5e0dc

# tab bar (Catppuccin Mocha)
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de

color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# Shift+Enter sends ESC+CR (same as alacritty; newline in omp/claude prompts)
map shift+enter send_text all \x1b\r

# Vi mode like alacritty (Ctrl+Shift+Space): open scrollback in nvim with colors; q quits
scrollback_pager ~/.config/kitty/scrollback-pager.sh
map ctrl+shift+space show_scrollback
